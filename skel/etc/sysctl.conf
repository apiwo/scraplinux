# Arctic Linux - sysctl defaults, applied by /etc/rc.boot at every boot.

# Would let any user open an unprivileged ICMP socket for ping instead of
# needing CAP_NET_RAW or a setuid-root binary, on a ping built to use that
# kernel API - ping(1) on Arctic is busybox's, which unconditionally opens
# a raw socket (see /etc/busybox.conf for how it actually gets non-root
# access here). Left set anyway: it is what a ping-socket-based build
# would need, costs nothing to have on regardless, and this is the entry
# a future switch to one would already expect to find.
net.ipv4.ping_group_range = 0 2147483647
