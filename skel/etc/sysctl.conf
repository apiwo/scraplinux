# Arctic Linux - sysctl defaults, applied by /etc/rc.boot at every boot.

# Let any user (root included) open an unprivileged ICMP socket for ping,
# instead of requiring CAP_NET_RAW or a setuid-root ping binary. Without
# this, toybox's ping refuses even for root with "socket: Permission
# denied" - the kernel treats SOCK_DGRAM ICMP as gated by this range
# regardless of privilege level, and it defaults to empty (nobody allowed).
net.ipv4.ping_group_range = 0 2147483647
