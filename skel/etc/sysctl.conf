# ScrapLinux - sysctl defaults, applied by /etc/rc.boot at every boot.

# Would let any user open an unprivileged ICMP socket for ping instead of
# needing CAP_NET_RAW or a setuid-root binary, on a ping built to use that
# kernel API - ping(1) on ScrapLinux is busybox's, which unconditionally opens
# a raw socket (see /etc/busybox.conf for how it actually gets non-root
# access here). Left set anyway: it is what a ping-socket-based build
# would need, costs nothing to have on regardless, and this is the entry
# a future switch to one would already expect to find.
net.ipv4.ping_group_range = 0 2147483647

# Magic SysRq, all functions. Alt+SysRq+t (dump every task's state) and
# Alt+SysRq+l (backtrace every CPU) are handled directly by the kernel's
# raw keyboard-interrupt path - independent of X, libinput, or even VT
# switching - so they still work when the machine looks completely frozen
# and nothing else does. Whatever they print lands in dmesg, which
# /etc/rc.boot now tails continuously to /var/log/dmesg-live.log, so it
# survives a hard power-off instead of being lost with the rest of the
# ring buffer in RAM.
kernel.sysrq = 1
