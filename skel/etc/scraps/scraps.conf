# scraps.conf - ScrapLinux Package Manager
#
# Repositories live in /etc/scraps/repos.d/*.repo, one file each.
# Anything here can be overridden by an environment variable of the same name.

# Where packages land. Change this to install into a different tree, or use
# scraps --root=/mnt for a one-off.
SCRAPS_ROOT=/

# Architecture this system installs.
SCRAPS_ARCH=x86_64

# What "scraps add <pkg>" does when neither -s nor -b is given.
#   source  the default: build the package here rather than trust a binary
#   binary  install the prebuilt .spz instead
# Either way, -s/--source and -b/--binary on the command line always win.
SCRAPS_BUILD_MODE=source

# Parallel jobs for source builds. Defaults to the CPU count.
# SCRAPS_JOBS=8

# Colour: auto, always or never.
SCRAPS_COLOR=auto

# How an install reports itself. Same resolver, same downloads, same progress
# bars either way - only the wording and layout change, so a style can never
# be more optimistic than the transaction actually is.
#
#   apt     the default: Debian's shape - "Reading package lists...", a
#           NEW-packages block, "N upgraded, N newly installed",
#           Get:/Setting up
#   scraplinux  apt's wording inside aeryn's frame - a boxed transaction
#           summary, then "Get:1 <url> [size]" and
#           "Setting up <pkg> (<version>)"
#   aeryn   Aeryn OS's shape: the box, then a fetch phase and an install
#           phase with a status glyph per package
#   pacman  Arch's shape: "Packages (4) name-ver-rel ...", Total Download
#           Size, then "(1/4) installing <pkg>"
#   void    XBPS's shape: a Name/Action/Version/Download size table, sizes
#           to download and required on disk, "[*]" phase markers
#   solus   eopkg's shape: "Following packages will be installed:", total
#           size, "Installing <pkg>, version <v>"
SCRAPS_STYLE=apt

# Keep this many transactions for 'scraps rollback'. Older ones are pruned.
SCRAPS_KEEP_TRANSACTIONS=20

# Source builds are tuned for this exact CPU when set to 1. Binary packages are
# always built for a generic x86_64.
SCRAPLINUX_NATIVE=0

# Never touch these, whatever a transaction asks for.
SCRAPS_NEVER_REMOVE="glibc busybox toybox scraps scraplinux-base"

# Snapshots. On a btrfs root, scraps takes a snapshot before every install and
# every removal, so a package change can always be undone - separately from
# scraps's own file-level rollback. Set to "off" to disable.
#   auto  snapshot when / is btrfs and scraplinux-snapshot is present (default)
#   off   never
SCRAPS_SNAPSHOT=auto
