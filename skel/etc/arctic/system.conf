# Arctic Linux - declarative system configuration
#
# This is the ongoing counterpart to /etc/arctic/install.conf, which only
# matters once, at install time. This one matters every time you run:
#
#     arctic-rebuild
#
# Every rebuild snapshots first if the root filesystem is btrfs (the same
# mechanism alpm itself already uses before any install or removal), and
# records a generation either way, so `arctic rollback` can always put
# things back the way they were - see the docs page on generations.
#
# This file starts empty on purpose: the first `arctic-rebuild` on a machine
# where everything below is empty (or the file does not exist yet) does not
# change anything - it fills the file in from what the machine already is,
# so the starting point always matches reality. From then on, this file is
# the truth: edit it, then rebuild.

# --------------------------------------------------------------- metadata
# Purely informational - printed by arctic-rebuild, changes nothing. A
# label for this particular machine's configuration, if you keep more than
# one system.conf around (a laptop and a server, say) and want a rebuild to
# say which one it is applying.
SYS_DESCRIPTION=""

# ---------------------------------------------------------- system identity
SYS_HOSTNAME=""
SYS_TZ=""
SYS_LOCALE=""
SYS_LANG=""
SYS_KEYMAP=""

# ------------------------------------------------------------ core services
# The complete list of services that should be enabled at boot - not an
# addition to what is already enabled, the actual list. This covers
# daemons, networking, sound and display managers alike: all of them are
# just names under /etc/rc.d, translated to whatever init the machine
# actually runs by arctic-init-setup. See the init systems doc page.
SYS_SERVICES=""

# ------------------------------------------------------------------ networking
# Same shape as install.conf's A_NET/A_WIFI_*/A_IP/A_GATEWAY/A_DNS, because
# this replaces it once the machine is installed - install.conf only ever
# runs once. Leave SYS_NET_MODE empty and rebuild never touches networking at
# all, the same as every field above: nothing declared means nothing managed.
#
#   dhcp    a wired link, handed to NetworkManager's own auto-default
#   static  SYS_IP (CIDR, e.g. 192.168.1.50/24), SYS_GATEWAY, SYS_DNS
#   wifi    SYS_WIFI_SSID, SYS_WIFI_PSK, optional SYS_WIFI_IFACE
#
# Rewriting a connection profile only happens when what is declared here
# actually differs from the profile already on disk - reconciling a wifi
# password that has not changed does not need to restart the link.
SYS_NET_MODE=""
SYS_WIFI_SSID=""
SYS_WIFI_PSK=""
SYS_WIFI_IFACE=""
SYS_IP=""
SYS_GATEWAY=""
SYS_DNS=""

# Present a different MAC per network rather than the adapter's real,
# permanent one. Same flag as install.conf's A_MAC_RANDOMIZE.
SYS_MAC_RANDOMIZE="no"

# -------------------------------------------------------------------- hardware
# What install.conf calls A_GPU and A_MICROCODE, kept declarative after
# install instead of a one-time detection. "auto" re-detects from the PCI
# bus / cpuinfo every rebuild rather than pinning whatever the machine had
# the day it was installed - the right choice on the same box forever,
# unless the card itself changes.
SYS_GPU="auto"
SYS_MICROCODE="auto"

# ------------------------------------------------------------------ bootloader
# Only the timeout is reconciled here. Switching the bootloader itself
# (limine <-> grub) after install means reinstalling boot sectors on a disk
# that is already carrying data - arctic-boot-strap is the tool for that,
# run by hand; a rebuild will say so rather than attempt it, the same as it
# would for anything else this system is not able to do safely unattended.
SYS_BOOTLOADER=""
SYS_BOOT_TIMEOUT=""

# -------------------------------------------------------------- user accounts
# One user per line: name:shell:groups (groups comma-separated). Declared
# users that do not exist yet are created on the next rebuild. This is
# additive only - an account already on the machine but not listed here is
# left alone rather than deleted, since removing a user's account and home
# directory automatically from an edited text file is a destructive
# action this tool will not take without being asked more directly than a
# missing line. Remove an account yourself with `userdel` if you want it
# gone.
#
#   SYS_USERS="
#   ray:/bin/zsh:wheel,users,audio,video
#   "
SYS_USERS=""

# ---------------------------------------------------------------- packages
# The complete list of explicitly installed packages - not a list of things
# to add, the actual list. Add a name and rebuild installs it; delete a
# name and rebuild removes it (and anything that was only pulled in as its
# dependency), the same as commenting a package out of a NixOS
# configuration.nix. Dependencies of whatever is listed here are managed
# for you - do not list them yourself.
SYS_PACKAGES=""

# Enables the nonfree and alt-nonfree repositories when yes, disables (but
# does not uninstall anything already present from them) when no. The
# nixpkgs equivalent is allowUnfree - this is the same idea, one flag
# gating whether non-free packages are even reachable by name rather than
# a decision made per package.
SYS_ALLOW_NONFREE="no"

# -------------------------------------------------------------------- lock
# Not something you edit. arctic-rebuild writes /etc/arctic/system.lock
# after every successful run: every explicitly installed package pinned to
# the exact version and release that is actually on the machine right now.
# It exists for the same reason a flake.lock does - system.conf says what
# should be installed, the lock file says exactly what version was, the
# last time this configuration was successfully applied. Nothing reads it
# back automatically yet; it is a record, not (yet) a pin enforced on the
# next rebuild.
