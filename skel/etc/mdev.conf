# ScrapLinux - mdev device manager rules
#
# Without this file, mdev creates /dev nodes for hardware the kernel
# already has a driver loaded for, and nothing else - no wireless card, no
# GPU, nothing needing a module gets its driver loaded automatically. Real
# hardware showed this directly: wlan0 never existed, GPU reported unknown,
# both are modular drivers that never got probed. This one line is what
# every other mdev-based init has to have to be usable on real machines.
$MODALIAS=.*	0:0 660 @modprobe "$MODALIAS" 2>/dev/null

# Sensible default device permissions for the common cases.
null		0:0 666
zero		0:0 666
full		0:0 666
random		0:0 666
urandom		0:0 666
tty		0:5 666
console		0:0 600
kmsg		0:0 660
mem		0:0 640
kmem		0:0 640
port		0:0 640

# Everything else, default.
.*		0:0 660
