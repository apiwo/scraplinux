# ScrapLinux - doas rules
permit persist :wheel
permit nopass :wheel cmd scraps args fetch all
# Preserve HOME specifically (not a blanket keepenv - that keeps every
# environment variable except a small built-in denylist, forwarding
# straight through to a root shell). Without this, `doas startx` runs
# with HOME=/root, so xinit looks for /root/.xinitrc - which does not
# exist - instead of the real user's, and silently falls back to
# xinit's own upstream default xinitrc.
permit persist setenv { HOME } :wheel
