# Arctic Linux - name service switch
#
# glibc reads this to decide where a name comes from. Without the file it
# falls back to a compiled-in order, which happens to work and is not
# something to depend on.
passwd:     files
group:      files
shadow:     files
hosts:      files dns
networks:   files
protocols:  files
services:   files
ethers:     files
rpc:        files
