# LLVM's runtimes build (libc++, libc++abi, libunwind) installs into a
# target-triple subdirectory by CMake's own default, not straight into
# /usr/lib like every other Arctic package. Nothing else uses this path -
# glibc's dynamic linker only trusts /lib and /usr/lib by default, so
# without this, clang itself fails to start on a freshly installed system:
# "error while loading shared libraries: libc++.so.1: cannot open shared
# object file". alpm already runs ldconfig after every transaction; this
# just gives it something to find.
/usr/lib/x86_64-unknown-linux-gnu
